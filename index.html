    // Real in-browser Web Crypto SHA-256 calculation
    async function computeSHA256(data) {
      const text = typeof data === 'object' ? canonicalJson(data) : String(data);
      const encoder = new TextEncoder();
      const buffer = encoder.encode(text);
      const hashBuffer = await window.crypto.subtle.digest('SHA-256', buffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return '0x' + hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function canonicalJson(obj) {
      if (obj === null || typeof obj !== 'object') return JSON.stringify(obj);
      if (Array.isArray(obj)) return '[' + obj.map(canonicalJson).join(',') + ']';
      const keys = Object.keys(obj).sort();
      return '{' + keys.map(k => JSON.stringify(k) + ':' + canonicalJson(obj[k])).join(',') + '}';
    }

            { test: 'Total Cholesterol', value: '218', unit: 'mg/dL', ref: '< 200', flag: 'BORDERLINE' },

    const INITIAL_REQUESTS = [

        patient: ROLES.patient1.address,
        requester: ROLES.insurance.address,
        purpose: 'Cashless Claim Settlement - Claim #CLM-STAR-2026-7731',

    function App() {
      const [activeRoleKey, setActiveRoleKey] = useState('patient1');
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'analytics', 'audit'
      const [records, setRecords] = useState(INITIAL_RECORDS);
      const [requests, setRequests] = useState(INITIAL_REQUESTS);
      const [logs, setLogs] = useState([
        { id: 1, action: 'RECORD_REGISTERED', recordId: 'REC-2026-001', detail: 'Discharge Summary anchored on-chain', actor: ROLES.hospital.address, status: true },
        { id: 2, action: 'RECORD_REGISTERED', recordId: 'REC-2026-002', detail: 'Cardiac Biomarker report anchored on-chain', actor: ROLES.lab.address, status: true },
        { id: 3, action: 'CONSENT_REQUESTED', recordId: 'REC-2026-001', detail: 'Claim settlement audit request', actor: ROLES.insurance.address, status: true },
        { id: 4, action: 'CONSENT_GRANTED', recordId: 'REC-2026-001', detail: 'Patient approved 7-day validity', actor: ROLES.patient1.address, status: true },
        { id: 5, action: 'RECORD_VERIFIED', recordId: 'REC-2026-001', detail: 'Integrity Verified: Hash Match', actor: ROLES.insurance.address, status: true }
      ]);

      const [selectedRecord, setSelectedRecord] = useState(null);
      const [verificationResult, setVerificationResult] = useState(null);
      const [consentModalReq, setConsentModalReq] = useState(null);

      // ROI Model Parameters
      const [claimsVolume, setClaimsVolume] = useState(15000);
      const [avgClaimAmount, setAvgClaimAmount] = useState(70000);

      const currentUser = ROLES[activeRoleKey];

      // Verification Handler
      const handleVerifyRecord = async (recordId, isTampered = false) => {
        const rec = records.find(r => r.recordId === recordId);
        if (!rec) return;

        let payload = JSON.parse(JSON.stringify(rec.clinicalData));
        if (isTampered) {
          payload.billingSummary.totalAmountINR += 150000; // Inflate bill
          payload.billingSummary.tamperedNote = "UNAUTHORIZED ALTERATION: Bill inflated by 150,000 INR";
        }

        const computedHash = await computeSHA256(payload);
        const isMatch = computedHash.toLowerCase() === rec.documentHash.toLowerCase();

        const result = {
          recordId,
          isAuthentic: isMatch,
          onChainHash: rec.documentHash,
          computedHash,
          isTamperedSimulation: isTampered,
          transactionHash: '0x' + Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b => b.toString(16).padStart(2, '0')).join('')
        };

        setVerificationResult(result);

        setLogs(prev => [
          {
            id: prev.length + 1,
            action: isMatch ? 'RECORD_VERIFIED' : 'SECURITY_ALERT',
            recordId,
            detail: isMatch ? 'Integrity Verified: Hash Match' : 'FRAUD DETECTED: Bill inflated & hash mismatch!',
            actor: currentUser.address,
            status: isMatch
          },
          ...prev
        ]);
      };

      // Consent Handlers
      const handleGrantConsent = (reqId, durationSec) => {
        setRequests(prev => prev.map(r => r.requestId === reqId ? { ...r, status: 'APPROVED', validUntil: Math.floor(Date.now() / 1000) + durationSec } : r));
        setLogs(prev => [
          { id: prev.length + 1, action: 'CONSENT_GRANTED', recordId: `REQ-${reqId}`, detail: `Patient approved access for ${durationSec}s`, actor: currentUser.address, status: true },
          ...prev
        ]);
        setConsentModalReq(null);
      };

      const handleRevokeConsent = (reqId) => {
        if (!confirm('Execute instant smart contract revocation? Access will be cut off immediately.')) return;
        setRequests(prev => prev.map(r => r.requestId === reqId ? { ...r, status: 'REVOKED' } : r));
        setLogs(prev => [
          { id: prev.length + 1, action: 'CONSENT_REVOKED', recordId: `REQ-${reqId}`, detail: 'Patient executed instant revocation', actor: currentUser.address, status: true },
          ...prev
        ]);
      };

      // ROI Model Calculations
      const adminCostManual = claimsVolume * 1850;
      const adminCostBlockchain = claimsVolume * 6.5;
      const adminSavings = adminCostManual - adminCostBlockchain;
      const fraudPrevented = claimsVolume * 0.12 * avgClaimAmount;
      const totalBenefit = adminSavings + fraudPrevented;
      const paybackMonths = ((1500000 / (totalBenefit / 12))).toFixed(1);

      return (
        <div className="min-h-screen flex flex-col">

              </button>
              <button

                MBA Economics
              </button>
              <button
                onClick={() => setActiveTab('audit')}

                                <td className="p-2.5 font-mono text-white font-bold">{r.recordId}</td>

                            ))}
                          </tbody>

                              </div>
                            </div>
                            <div className="flex gap-2">
                              <button

                              <button

                              >
                                Verify Hash
                              </button>
                            </div>

                      </div>
                    </div>
                  </div>
                )}

                {/* INSURANCE VIEW (ANTI-FRAUD CORE) */}
                {currentUser.role === 'INSURANCE_COMPANY' && (
                  <div className="space-y-6">
                    {/* Interactive Fraud Detection Banner */}
                    <div className="bg-gradient-to-r from-red-950/40 via-slate-900 to-slate-900 border border-red-500/30 rounded-2xl p-6 space-y-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">

                          </h3>
                          <p className="text-xs text-slate-300 mt-1 max-w-xl">
                            Test the smart contract anti-tampering engine. Verify the authentic claim or simulate an inflated bill (+₹150,000) to see the blockchain automatically flag fraud!
                          </p>
                        </div>
                        <div className="flex space-x-2">
                          <button
                            onClick={() => handleVerifyRecord('REC-2026-001', false)}
                            className="px-4 py-2 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/30 rounded-xl text-xs font-bold"
                          >
                            1. Verify Authentic (Match)
                          </button>
                          <button
                            onClick={() => handleVerifyRecord('REC-2026-001', true)}
                            className="px-4 py-2 bg-red-500 hover:bg-red-400 text-slate-950 font-bold rounded-xl text-xs shadow-lg shadow-red-500/20"
                          >
                            2. Simulate Fraud Tamper (+₹1.5L)
                          </button>
                        </div>
                      </div>
                    </div>

                    {/* Claims Desk Portfolio */}
                    <div className="space-y-4">
                      <h3 className="text-sm font-bold text-white">All Network Records (Claims Desk)</h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {records.map(rec => {
                          const hasConsent = requests.some(r => r.recordId === rec.recordId && r.requester === currentUser.address && r.status === 'APPROVED');
                          return (
                            <div key={rec.recordId} className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between">
                              <div>
                                <div className="flex justify-between items-start mb-2">
                                  <span className="font-mono font-bold text-white text-sm">{rec.recordId}</span>
                                  <span className="text-[10px] px-2 py-0.5 rounded bg-purple-500/20 text-purple-300 font-mono">{rec.docType}</span>
                                </div>
                                <div className="bg-slate-950 p-2 rounded text-[11px] font-mono text-slate-400 break-all mb-3 select-all">
                                  {rec.documentHash}
                                </div>
                              </div>
                              <div className="flex gap-2">
                                {hasConsent ? (
                                  <button
                                    onClick={() => setSelectedRecord(rec)}
                                    className="flex-1 py-1.5 bg-brand-500/10 text-brand-300 hover:bg-brand-500/20 rounded-lg text-xs font-semibold"
                                  >
                                    View Record
                                  </button>
                                ) : (
                                  <span className="flex-1 py-1.5 bg-slate-950 text-slate-500 text-center rounded-lg text-xs italic">
                                    Patient Consent Required
                                  </span>
                                )}
                                <button
                                  onClick={() => handleVerifyRecord(rec.recordId, false)}
                                  className="py-1.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs"
                                >
                                  Verify Hash
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}

                {/* HOSPITAL / LAB VIEW */}
                {(currentUser.role === 'HOSPITAL' || currentUser.role === 'DIAGNOSTIC_LAB') && (
                  <div className="space-y-4">
                    <h3 className="text-sm font-bold text-white">Records Issued by {currentUser.name}</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                      {records.filter(r => r.issuer === currentUser.address).map(rec => (
                        <div key={rec.recordId} className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between">
                          <div>
                            <div className="flex justify-between items-start mb-2">
                              <span className="font-mono font-bold text-white text-sm">{rec.recordId}</span>
                              <span className="text-[10px] px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-mono">{rec.docType}</span>
                            </div>
                            <div className="bg-slate-950 p-2 rounded text-[11px] font-mono text-slate-400 break-all mb-3 select-all">
                              {rec.documentHash}
                            </div>
                          </div>
                          <div className="flex gap-2">
                            <button
                              onClick={() => setSelectedRecord(rec)}
                              className="flex-1 py-1.5 bg-brand-500/10 text-brand-300 hover:bg-brand-500/20 rounded-lg text-xs font-semibold"
                            >
                              View Record
                            </button>
                            <button
                              onClick={() => handleVerifyRecord(rec.recordId, false)}
                              className="py-1.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs"
                            >
                              Verify Hash
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

              </div>
            )}

            {/* 2. MBA ECONOMICS VIEW */}
            {activeTab === 'analytics' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-r from-emerald-950/60 via-slate-900 to-slate-950 border border-emerald-500/20 rounded-2xl p-6">
                  <h2 className="text-2xl font-bold text-white">MBA Economics & Health Insurance Feasibility</h2>
                  <p className="text-xs text-slate-400 mt-1">Quantitative model evaluating administrative cost reduction, fraud loss prevention, and ROI.</p>
                </div>

                {/* KPI Cards */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <span className="text-[10px] text-slate-400 uppercase font-semibold">Cost Reduction</span>
                    <div className="text-2xl font-bold text-emerald-400 font-mono mt-1">99.6%</div>
                    <span className="text-[11px] text-slate-500">₹1,850 → ₹6.50 / claim</span>
                  </div>
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <span className="text-[10px] text-slate-400 uppercase font-semibold">Turnaround Speed</span>
                    <div className="text-2xl font-bold text-blue-400 font-mono mt-1">&lt; 4 Hours</div>
                    <span className="text-[11px] text-slate-500">Accelerated from 21 days</span>
                  </div>
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <span className="text-[10px] text-slate-400 uppercase font-semibold">Payback Period</span>
                    <div className="text-2xl font-bold text-purple-400 font-mono mt-1">{paybackMonths} Months</div>
                    <span className="text-[11px] text-slate-500">On ₹15 Lakh CapEx</span>
                  </div>
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <span className="text-[10px] text-slate-400 uppercase font-semibold">Year-1 Value</span>
                    <div className="text-2xl font-bold text-brand-400 font-mono mt-1">₹{(totalBenefit / 10000000).toFixed(2)} Cr</div>
                    <span className="text-[11px] text-slate-500">Admin + Fraud Mitigation</span>
                  </div>
                </div>

                {/* Interactive Calculator */}
                <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                  <h3 className="text-sm font-bold text-white">Interactive Healthcare Claim ROI Simulator</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <div>
                      <div className="flex justify-between text-xs mb-2">
                        <span className="text-slate-300 font-semibold">Annual Claim Volume:</span>
                        <span className="font-mono text-brand-400 font-bold">{claimsVolume.toLocaleString()} claims</span>
                      </div>
                      <input
                        type="range"
                        min="2000"
                        max="50000"
                        step="1000"
                        value={claimsVolume}
                        onChange={(e) => setClaimsVolume(Number(e.target.value))}
                        className="w-full accent-brand-500"
                      />
                    </div>
                    <div>
                      <div className="flex justify-between text-xs mb-2">
                        <span className="text-slate-300 font-semibold">Average Claim Size (INR):</span>
                        <span className="font-mono text-emerald-400 font-bold">₹{avgClaimAmount.toLocaleString('en-IN')}</span>
                      </div>
                      <input
                        type="range"
                        min="25000"
                        max="200000"
                        step="5000"
                        value={avgClaimAmount}
                        onChange={(e) => setAvgClaimAmount(Number(e.target.value))}
                        className="w-full accent-emerald-500"
                      />
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 3. AUDIT VIEW */}
            {activeTab === 'audit' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold text-white">Immutable Append-Only Audit Stream ({logs.length} Events)</h3>
                  <span className="text-[10px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
                    EVM Block Sequence Live
                  </span>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-950 text-slate-400 text-[10px] uppercase font-semibold">
                      <tr>
                        <th className="p-2.5">ID</th>
                        <th className="p-2.5">Action</th>
                        <th className="p-2.5">Record</th>
                        <th className="p-2.5">Actor Wallet</th>
                        <th className="p-2.5">Details</th>
                        <th className="p-2.5 text-right">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800 text-slate-300">
                      {logs.map(log => (
                        <tr key={log.id}>
                          <td className="p-2.5 font-mono">#{log.id}</td>
                          <td className="p-2.5">
                            <span className="text-[10px] px-2 py-0.5 rounded font-mono font-bold bg-slate-800 text-slate-200">
                              {log.action}
                            </span>
                          </td>
                          <td className="p-2.5 font-mono text-white font-bold">{log.recordId}</td>
                          <td className="p-2.5 font-mono text-slate-400 truncate max-w-[140px]">{log.actor}</td>
                          <td className="p-2.5 text-slate-300">{log.detail}</td>
                          <td className="p-2.5 text-right">
                            <span className={`text-[10px] font-bold ${log.status ? 'text-emerald-400' : 'text-red-400'}`}>
                              {log.status ? '✔ SUCCESS' : '✖ BLOCKED'}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>

          {/* Verification Modal */}
          {verificationResult && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-2xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white text-base">Cryptographic SHA-256 Verification Result</h3>
                  <button onClick={() => setVerificationResult(null)} className="text-slate-400 hover:text-white font-bold text-lg">✕</button>
                </div>
                <div className={`p-4 rounded-xl border ${
                  verificationResult.isAuthentic ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : 'bg-red-500/10 border-red-500/30 text-red-300'
                }`}>
                  <h4 className="font-bold text-sm">
                    {verificationResult.isAuthentic ? '✔ 100% CRYPTOGRAPHIC INTEGRITY VERIFIED (MATCH)' : '✖ FRAUD ALERT: RECORD TAMPERING DETECTED!'}
                  </h4>
                  <p className="text-xs mt-1 opacity-90">
                    {verificationResult.isAuthentic
                      ? 'The calculated SHA-256 digest of the off-chain clinical document exactly matches the smart contract fingerprint.'
                      : 'The calculated SHA-256 digest does not match the smart contract fingerprint. Hospital billing alteration detected! Claim payout auto-blocked.'}
                  </p>
                </div>
                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2 text-xs">
                  <div>
                    <span className="text-[10px] text-slate-500 uppercase block font-semibold">Smart Contract On-Chain Fingerprint:</span>
                    <span className="font-mono text-emerald-400 text-xs break-all">{verificationResult.onChainHash}</span>
                  </div>
                  <div>
                    <span className="text-[10px] text-slate-500 uppercase block font-semibold">Calculated SHA-256 Digest (Submitted Document):</span>
                    <span className={`font-mono text-xs break-all ${verificationResult.isAuthentic ? 'text-emerald-400' : 'text-red-400 font-bold'}`}>
                      {verificationResult.computedHash}
                    </span>
                  </div>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setVerificationResult(null)} className="px-5 py-2 bg-slate-800 text-white rounded-xl text-xs font-semibold">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Record Detail Modal */}
          {selectedRecord && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-2xl max-h-[85vh] overflow-y-auto p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="font-bold text-white text-base">{selectedRecord.recordId}</h3>
                    <p className="text-xs text-slate-400">Authenticated Off-Chain Clinical Document</p>
                  </div>
                  <button onClick={() => setSelectedRecord(null)} className="text-slate-400 hover:text-white font-bold text-lg">✕</button>
                </div>
                <div className="bg-slate-950 p-3 rounded-xl border border-brand-500/30 text-xs">
                  <span className="text-brand-400 font-bold block text-[10px] uppercase">SHA-256 On-Chain Anchor:</span>
                  <span className="font-mono text-slate-300 break-all">{selectedRecord.documentHash}</span>
                </div>
                <pre className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs text-slate-300 font-mono overflow-x-auto">
                  {JSON.stringify(selectedRecord.clinicalData, null, 2)}
                </pre>
                <div className="flex justify-end">
                  <button onClick={() => setSelectedRecord(null)} className="px-5 py-2 bg-slate-800 text-white rounded-xl text-xs font-semibold">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Consent Modal */}
          {consentModalReq && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md p-6 space-y-4">
                <h3 className="font-bold text-white text-base">Grant Patient Access Consent</h3>
                <p className="text-xs text-slate-300">Authorize time-bound access for record <span className="font-mono text-white font-bold">{consentModalReq.recordId}</span>.</p>
                <div className="grid grid-cols-3 gap-2">
                  <button onClick={() => handleGrantConsent(consentModalReq.requestId, 3600)} className="p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-center hover:border-brand-500 text-xs font-bold text-white">
                    1 Hour
                  </button>
                  <button onClick={() => handleGrantConsent(consentModalReq.requestId, 86400)} className="p-2.5 bg-brand-500/20 border border-brand-500 rounded-xl text-center text-xs font-bold text-brand-300">
                    24 Hours
                  </button>
                  <button onClick={() => handleGrantConsent(consentModalReq.requestId, 604800)} className="p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-center hover:border-brand-500 text-xs font-bold text-white">
                    7 Days
                  </button>
                </div>
                <div className="flex justify-end space-x-2 pt-2">
                  <button onClick={() => setConsentModalReq(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs">
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-900 bg-slate-950 py-3 px-6 text-xs text-slate-500 text-center">
            MediLedger Portable Web App • Works on Any PC, Mac, Tablet, or Phone • Real SHA-256 Cryptographic Engine
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
